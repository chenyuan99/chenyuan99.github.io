name: Publish yuanchen.io
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the existing Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Include the prebuilt StageLight site
        run: |
          test -s _site/index.html
          mkdir publish
          rsync -r --exclude=/StageLight/ _site/ publish/
          cp -R StageLight publish/
          test -s publish/StageLight/index.html
          test -d publish/StageLight/_next/static/chunks
      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: pages
